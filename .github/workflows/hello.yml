
name: Hello world

on: push

jobs:
  say_hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, world!"

  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Style check
        uses: jpetrucciani/black-check@26.10.1
        with:
          path: "silly_example"
